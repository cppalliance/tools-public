[package]
name = "png2jpg"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Convert PNG files to JPEG at quality 50"

[dependencies]
image = "0.25"
anyhow = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
